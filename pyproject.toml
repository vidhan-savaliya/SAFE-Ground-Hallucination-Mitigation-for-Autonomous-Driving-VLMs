[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "safe-ground"
version = "0.1.0"
description = "Severity-Aware, Omission-Aware Hallucination Detection & Mitigation for Driving VLMs"
readme = "README.md"
requires-python = ">=3.9"
authors = [
    {name = "SAFE-Ground Research Team"}
]
dependencies = [
    "torch>=2.1.0",
    "scipy>=1.11.0",
    "numpy>=1.24.0",
    "pyyaml>=6.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["safe_ground*"]

